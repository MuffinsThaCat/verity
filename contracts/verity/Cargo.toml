[package]
name = "verity"
version = "1.0.0"
edition = "2021"
rust-version = "1.86"
description = "Verity: perpetual belief markets for an encyclopedia that prices its own claims"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.9.0"

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
